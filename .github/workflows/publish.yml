name: Publish to npm

# Trigger: create a GitHub Release (tag vX.Y.Z) or run manually.
# npm Trusted Publisher (OIDC) — no NPM_TOKEN secret needed.
# npm-side config must match:
#   Organization or user:  Andy8647
#   Repository:            pi-ghostty-tab
#   Workflow filename:     publish.yml
#   Environment name:      npm        (must match `environment:` below)
#   Allowed actions:       Allow npm publish
#
# NOTE: OIDC cannot create a package that does not exist on the registry.
# The very first 0.1.0 publish must be done interactively
# (npm login --auth-type=web + 2FA, then npm publish); bind the trusted
# publisher afterwards and use this workflow from then on.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # required for OIDC trusted publishing + provenance
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # Verify the release tag matches package.json version (release trigger only)
      - name: Check version matches tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
